name: Validate Project

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          test -f README.md
          test -f web-app/index.html
          test -f commands/deployment-commands.md
          echo "Repository structure looks good."
